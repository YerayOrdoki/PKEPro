name: Optimizar imagenes

on:
  push:
    branches: [main]
    paths:
      - 'src/img/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick webp

      - name: Convertir a WebP
        run: |
          shopt -s nullglob nocaseglob
          for f in src/img/*.jpg src/img/*.jpeg src/img/*.png; do
            base="${f%.*}"
            name="$(basename "$base")"
            width=1000
            if [ "$name" = "hasiera" ]; then width=1600; fi
            convert "$f" -auto-orient -resize "${width}x>" -strip -quality 80 "$base.webp"
          done

      - name: Commit de los WebP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/img/*.webp
          git diff --cached --quiet || (git commit -m "Irudiak WebP-ra bihurtu eta txikitu" && git push)
