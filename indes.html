<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap 5 - 1. Saioa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <header class="container mt-5 bg-white p-4 shadow-sm rounded">
        <h2 class="mb-4 text-center border-bottom pb-2">Music Store</h2>
        <div class="row align-items-center">
            <div class="col-12 col-md-5 order-1 order-md-2 text-center mb-4 mb-md-0">
                <img src="https://placehold.co/600x400" alt="Portada del Álbum" class="img-fluid rounded shadow">
            </div>
            <div class="col-12 col-md-7 order-2 order-md-1">
                <h1 class="display-5 fw-bold">The Dark Side of the Moon</h1>
                <p class="lead text-muted">Pink Floyd</p>
                <h3 class="text-primary mb-3">25,99 €</h3>
                <button class="btn btn-dark btn-lg w-100 w-md-auto">Gehitu saskira</button>
            </div>
        </div>
    </header>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
