<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laborategia 1 eta 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <header class="container">
        <h1>Music Store</h1>
        <div class="row">
            <div class="col-12 col-md-5 order-1 order-md-2">
                <img src="https://placehold.co/600x400" alt="Portada" class="img-fluid">
            </div>
            <div class="col-12 col-md-7 order-2 order-md-1">
                <h2>The Dark Side of the Moon</h2>
                <p>Pink Floyd</p>
                <p>25,99 €</p>
                <button class="btn btn-primary">Gehitu saskira</button>
            </div>
        </div>
    </header>

    <hr>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand">Metrics Dashboard</span>
        </div>
    </nav>

    <div class="container-fluid">
        <div class="row">
            
            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card">
                    <div class="card-body">
                        <!-- 3. Flexbox bidezko lerrokatzea -->
                        <div class="d-flex justify-content-between align-items-center">
                            <h5>Salmentak</h5>
                            <span>EUR</span>
                        </div>
                        <!-- 3. Eduki habiatua (row eta col) -->
                        <div class="row">
                            <div class="col-12">
                                <p>12.500 €</p>
                            </div>
                        </div>
                        <!-- 4. Ikusgaitasunaren kontrola (d-none d-lg-block) -->
                        <div class="d-none d-lg-block">
                            <small>+10% azken hilabetean</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5>Erabiltzaileak</h5>
                            <span>N/A</span>
                        </div>
                        <div class="row">
                            <div class="col-12">
                                <p>1.200</p>
                            </div>
                        </div>
                        <div class="d-none d-lg-block">
                            <small>Aktiboak une honetan</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5>Eskaerak</h5>
                            <span>Kop</span>
                        </div>
                        <div class="row">
                            <div class="col-12">
                                <p>450</p>
                            </div>
                        </div>
                        <div class="d-none d-lg-block">
                            <small>-2% gaur</small>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-xl-3">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5>Irabaziak</h5>
                            <span>EUR</span>
                        </div>
                        <div class="row">
                            <div class="col-12">
                                <p>3.200 €</p>
                            </div>
                        </div>
                        <div class="d-none d-lg-block">
                            <small>Garbia</small>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
